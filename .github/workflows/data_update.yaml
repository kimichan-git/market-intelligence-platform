name: Daily Market Data Update

on:
  schedule:
    - cron: '0 22 * * *' # 每天收盤後執行 (UTC 時間)
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write # 明確要求寫入權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 升級到 v4

      - name: Set up Python
        uses: actions/setup-python@v5 # 升級到 v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install python-dotenv openai

      - name: Run update script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python run_daily_update.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ reports/
          git commit -m "Auto-update market data [skip ci]" || echo "No changes to commit"
          # 新增這行：先拉取遠端最新的代碼，避免衝突
          git pull --rebase origin main
          git push

